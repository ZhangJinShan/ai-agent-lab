spring:
  application:
    name: project01-doc-qa
  autoconfigure:
    exclude:
      # 本项目只用 chat + embedding;音频/图片/审核模型不需要,
      # 排除掉它们的自动装配(不建 bean 就不需要凭证)
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    openai:
      # 真实 key 走环境变量 LLM_API_KEY;Day 4 之前不实际调模型,给默认值保证能启动
      api-key: ${LLM_API_KEY:sk-not-configured}
      base-url: https://llm-t434y2d2k03iub6z.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      # chat / embedding 的模型名 Day 4 再填
      chat:
        model: glm-5.3
      embedding:
        model: qwen3.7-text-embedding-flash
docqa:
  docs-dir: docs      # 文档路径(相对启动工作目录,IDEA 运行配置里设 $MODULE_DIR$)
